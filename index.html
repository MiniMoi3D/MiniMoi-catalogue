<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --whatsapp: #25d366;
      --whatsapp-hover: #1da851;
      --radius: 12px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    /* Header & Branding */
    header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-logo { height: 38px; width: auto; object-fit: contain; }
    .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

    /* Hero */
    .hero { background: linear-gradient(180deg, rgba(37, 99, 235, 0.1) 0%, rgba(15, 23, 42, 0) 100%); text-align: center; padding: 48px 24px 32px; border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 12px; }
    .hero p { color: var(--muted); max-width: 600px; margin: 0 auto; font-size: 1rem; }

    /* Controls Bar */
    .controls { max-width: 1200px; margin: 24px auto 0; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
    .search-sort { display: flex; gap: 12px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 240px; }
    input[type="text"], select { width: 100%; padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }

    .category-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .chip { padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 999px; font-size: 0.875rem; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .chip.active, .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* Product Grid */
    .catalog { max-width: 1200px; margin: 24px auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }

    .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1; background: #020617; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
    .card-img.loaded { opacity: 1; }

    .badge-wrap { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-featured { background: var(--accent); color: white; }
    .badge-new { background: #10b981; color: white; }
    .badge-oos { background: #ef4444; color: white; }

    .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .card-meta { margin-bottom: 12px; }
    .card-category { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .card-price { font-size: 1.25rem; font-weight: 700; color: var(--text); }

    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.875rem; transition: background 0.2s; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-wa { background: var(--whatsapp); color: white; }
    .btn-wa:hover { background: var(--whatsapp-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Quick View Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); max-width: 600px; width: 100%; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    .modal-body { padding: 24px; }
    .modal-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 16px; }

    /* Floating WhatsApp Button */
    .float-wa { position: fixed; bottom: 24px; right: 24px; background: var(--whatsapp); color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); text-decoration: none; font-size: 1.5rem; z-index: 30; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }

    /* Loader */
    .loader { text-align: center; grid-column: 1 / -1; padding: 48px; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <img id="companyLogo" src="" alt="Logo" class="brand-logo" style="display: none;">
      <div id="companyName" class="brand-name">My Store</div>
    </div>
  </header>

  <section class="hero">
    <h1>Custom Precision 3D Prints</h1>
    <p>Browse our live inventory of functional models, fidgets, and custom designs.</p>
  </section>

  <section class="controls">
    <div class="search-sort">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products or SKUs..." oninput="filterProducts()">
      </div>
      <div style="width: 180px;">
        <select id="sortSelect" onchange="filterProducts()">
          <option value="default">Sort by: Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>
    </div>
    <div class="category-chips" id="categoryChips">
      <button class="chip active" onclick="selectCategory('All', this)">All Products</button>
    </div>
  </section>

  <main class="catalog" id="productGrid">
    <div class="loader">Loading product catalog...</div>
  </main>

  <!-- Quick View Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <!-- Floating WA Button -->
  <a id="floatWaBtn" href="#" class="float-wa" target="_blank" title="Chat with us">💬</a>

  <script>
    // ==========================================
    // CONFIGURATION (EDIT YOUR DETAILS HERE)
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxn7rwSkb0kPH0hZKvDc0e-M2XabHWmppfWIVWnZ5_PW31uZZfJwOObUUdJ6jk1ydJNxA/exec";
    const PHONE_NUMBER = "601173198329"; 
    const COMPANY_NAME = "MiniMoi";
    const LOGO_URL = "https://drive.google.com/uc?export=view&id=11UH0BbvCugF3YVb7pY0XX_oavVMJ5f_u"
    // ==========================================

    let rawProducts = [];
    let currentCategory = "All";

    // Setup Store Branding
    function setupBranding() {
      document.getElementById("companyName").textContent = COMPANY_NAME;
      document.title = COMPANY_NAME + " — Catalog";
      
      const logoEl = document.getElementById("companyLogo");
      if (LOGO_URL && LOGO_URL.trim() !== "") {
        logoEl.src = LOGO_URL;
        logoEl.style.display = "block";
      }
      
      document.getElementById("floatWaBtn").href = `https://wa.me/${PHONE_NUMBER}`;
    }

    // Fetch products from Google Sheets API
    async function loadProducts() {
      setupBranding();
      try {
        const response = await fetch(API_URL);
        const json = await response.json();

        if (json.status === "success") {
          rawProducts = json.data.filter(item => String(item.status).toLowerCase() === "active");
          buildCategories();
          filterProducts();
        } else {
          showError("Failed to parse sheet data.");
        }
      } catch (err) {
        showError("Could not connect to Google Apps Script API.");
      }
    }

    function buildCategories() {
      const categories = ["All", ...new Set(rawProducts.map(p => p.category).filter(Boolean))];
      const container = document.getElementById("categoryChips");
      container.innerHTML = categories.map(cat => `
        <button class="chip ${cat === 'All' ? 'active' : ''}" onclick="selectCategory('${cat}', this)">${cat}</button>
      `).join("");
    }

    function selectCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      filterProducts();
    }

    function filterProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;

      let filtered = rawProducts.filter(p => {
        const matchesCat = currentCategory === "All" || p.category === currentCategory;
        const matchesSearch = (p.productName || "").toLowerCase().includes(search) || 
                              (p.sku || "").toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (sort === "price-low") filtered.sort((a, b) => Number(a.price) - Number(b.price));
      if (sort === "price-high") filtered.sort((a, b) => Number(b.price) - Number(a.price));

      renderGrid(filtered);
    }

    function renderGrid(products) {
      const grid = document.getElementById("productGrid");
      if (products.length === 0) {
        grid.innerHTML = `<div class="loader">No products found.</div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const isOOS = Number(p.stock) <= 0;
        const isFeatured = String(p.featured).toLowerCase() === "true" || String(p.featured) === "1";
        const isNew = String(p.newArrival).toLowerCase() === "true" || String(p.newArrival) === "1";
        
        const waMessage = encodeURIComponent(`Hi ${COMPANY_NAME}, I would like to order:\n\n*Product:* ${p.productName}\n*SKU:* ${p.sku}\n*Price:* $${p.price}`);
        const waLink = `https://wa.me/${PHONE_NUMBER}?text=${waMessage}`;

        return `
          <div class="card">
            <div class="card-img-wrap">
              <div class="badge-wrap">
                ${isOOS ? `<span class="badge badge-oos">Out of Stock</span>` : ''}
                ${isFeatured ? `<span class="badge badge-featured">Featured</span>` : ''}
                ${isNew ? `<span class="badge badge-new">New</span>` : ''}
              </div>
              <img src="${p.imageUrl || 'https://via.placeholder.com/300'}" alt="${p.productName}" class="card-img" loading="lazy" onload="this.classList.add('loaded')">
            </div>
            <div class="card-body">
              <div class="card-meta">
                <div class="card-category">${p.category || 'General'}</div>
                <div class="card-title">${p.productName}</div>
                <div class="card-price">$${Number(p.price).toFixed(2)}</div>
              </div>
              <div class="card-actions">
                <button class="btn btn-secondary" onclick="openQuickView('${p.sku}')">Quick View</button>
                <a href="${waLink}" target="_blank" class="btn btn-wa ${isOOS ? 'disabled' : ''}" ${isOOS ? 'onclick="return false;"' : ''}>WhatsApp</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openQuickView(sku) {
      const p = rawProducts.find(item => item.sku === sku);
      if (!p) return;

      const waMessage = encodeURIComponent(`Hi ${COMPANY_NAME}, I would like to order:\n\n*Product:* ${p.productName}\n*SKU:* ${p.sku}\n*Price:* $${p.price}`);
      const waLink = `https://wa.me/${PHONE_NUMBER}?text=${waMessage}`;
      const isOOS = Number(p.stock) <= 0;

      document.getElementById("modalContent").innerHTML = `
        <img src="${p.imageUrl || 'https://via.placeholder.com/600'}" class="modal-img" alt="${p.productName}">
        <div class="card-category">${p.category}</div>
        <h2>${p.productName}</h2>
        <div class="card-price" style="margin: 8px 0;">$${Number(p.price).toFixed(2)}</div>
        <p style="color: var(--muted); margin-bottom: 16px; font-size: 0.95rem;">${p.description || 'No description provided.'}</p>
        <p style="margin-bottom: 16px; font-size: 0.875rem;"><strong>Stock Availability:</strong> ${isOOS ? 'Out of Stock' : p.stock + ' units available'}</p>
        <a href="${waLink}" target="_blank" class="btn btn-wa ${isOOS ? 'disabled' : ''}" style="width: 100%; padding: 12px;" ${isOOS ? 'onclick="return false;"' : ''}>Order via WhatsApp</a>
      `;
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal(e) {
      if (!e || e.target.id === "modalOverlay" || e.target.classList.contains("modal-close")) {
        document.getElementById("modalOverlay").classList.remove("open");
      }
    }

    function showError(msg) {
      document.getElementById("productGrid").innerHTML = `<div class="loader" style="color: #ef4444;">${msg}</div>`;
    }

    loadProducts();
  </script>
</body>
</html>
